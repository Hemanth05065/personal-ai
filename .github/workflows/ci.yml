name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check backend tests eval
      - name: Test
        # Tests use an in-memory database and mock Ollama: no models or services needed.
        # Includes the evaluation harness's checks and its reference solutions.
        run: pytest -q

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24: the version the runner's permission sandbox was tested with.
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Evaluation runner (Pyodide sandbox)
        # The harness's code runner: same self-test rules as the Output panel, and Node's
        # permission model blocks processes and reads outside the repository.
        working-directory: .
        run: node --test eval/runner.test.mjs
